[package]
name = "keystone"
version = "0.1.0"
description = "Keystone: a Tauri + React license-activation demo"
edition = "2021"
license = "MIT"

[lib]
name = "keystone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
license-core = { path = "../../crates/license-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
machine-uid = "0.5"
gethostname = "0.5"
thiserror = "1"

[features]
default = ["demo-controls"]
# Exposes the "simulate time passing" command used to demo the grace period.
# Build without it for anything resembling a real release:
#   cargo tauri build -- --no-default-features
demo-controls = []
